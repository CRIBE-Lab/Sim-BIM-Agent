<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sim-BIM 查看器</title>
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<div class="app">
  <aside class="panel" id="panel" aria-label="模型控制">
    <header class="panel-head">
      <h1 id="name"></h1>
      <p class="meta" id="meta"></p>
    </header>

    <section class="group">
      <h2>图层</h2>
      <div id="layers" class="rows"></div>
    </section>

    <section class="group">
      <h2>楼层</h2>
      <div id="storeys" class="rows"></div>
    </section>

    <section class="group">
      <h2>显示</h2>
      <label class="row"><input type="checkbox" id="roomColours" checked><span>按房间着色</span></label>
      <label class="slider">
        <span>楼层分离</span>
        <input type="range" id="explode" min="0" max="1" step="0.01" value="0">
        <output id="explodeOut">0 m</output>
      </label>
      <div id="reference" hidden>
        <label class="row"><input type="checkbox" id="referenceOn"><span>叠加原始网格</span></label>
        <label class="slider">
          <span>透明度</span>
          <input type="range" id="referenceOpacity" min="0.1" max="1" step="0.05" value="0.6">
          <output id="referenceOut">60%</output>
        </label>
        <p class="hint" id="referenceStatus"></p>
      </div>
    </section>

    <section class="group">
      <h2>剖切</h2>
      <div id="sections" class="rows"></div>
    </section>

    <section class="group">
      <h2>工具</h2>
      <div class="buttons">
        <button type="button" id="measure" aria-pressed="false">测量</button>
        <button type="button" id="resetView">重置视角</button>
        <button type="button" id="screenshot">截图</button>
      </div>
      <p class="hint" id="hint">点击构件查看属性。拖动旋转，右键平移，滚轮缩放。</p>
    </section>

    <section class="group notes">
      <details id="issues">
        <summary>待处理事项 <span class="count" id="issueCount"></span></summary>
        <ul id="issueList"></ul>
      </details>
      <details>
        <summary>假设 <span class="count" id="assumptionCount"></span></summary>
        <ul id="assumptionList"></ul>
      </details>
    </section>
  </aside>

  <main class="stage" id="stage">
    <button type="button" class="panel-toggle" id="panelToggle" aria-controls="panel">控制面板</button>
    <div class="compass" id="compass" aria-hidden="true"><div class="needle"></div><span class="north">北</span></div>
    <div class="inspector" id="inspector" hidden></div>
    <div class="labels" id="labels"></div>
  </main>
</div>
<script type="application/json" id="building">__BUILDING_JSON__</script>
<script src="assets/three.min.js"></script>
<script src="assets/OrbitControls.js"></script>
<script src="assets/GLTFLoader.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
